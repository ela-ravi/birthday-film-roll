<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>__TITLE__</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; font-family: 'Segoe UI', Tahoma, sans-serif; }
  #gate { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #fff; padding: 20px; text-align: center; }
  #gate h1 { font-size: 22px; font-weight: 600; }
  input { padding: 12px 14px; font-size: 16px; border-radius: 6px; border: none; width: 240px; max-width: 80vw; }
  button { padding: 12px 20px; font-size: 15px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; background: #fff; }
  #msg { color: #f87171; min-height: 20px; font-size: 14px; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<form id="gate">
  <h1>🎂 A birthday surprise for __NAME__</h1>
  <input id="pw" type="password" placeholder="Enter password" autocomplete="current-password" autofocus>
  <button type="submit">Open</button>
  <div id="msg"></div>
</form>
<script>
const SALT = "__SALT__";
const IV = "__IV__";
const ITER = __ITER__;
const DATA = "__DATA__";

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "Opening...";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(DATA));
    const frame = document.createElement("iframe");
    frame.setAttribute("allow", "fullscreen *"); // "*" is needed: a srcdoc frame has no origin of its own
    frame.srcdoc = new TextDecoder().decode(plain);
    document.body.innerHTML = "";
    document.body.appendChild(frame);
  } catch (err) {
    msg.textContent = window.crypto && crypto.subtle ? "Wrong password. Try again." : "Please open this over https or in Chrome/Safari.";
  }
});
</script>
</body>
</html>
