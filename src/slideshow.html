<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__TITLE__</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 9/16;
      max-height: 95vh;
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .container:fullscreen { max-width: none; max-height: none; border-radius: 0; }
    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .slide.active { opacity: 1; }
    .counter {
      position: absolute; top: 16px; left: 16px;
      color: #fff; font-size: 14px; font-weight: 600;
      background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px; z-index: 10;
    }
    .caption {
      position: absolute; bottom: 80px; left: 16px; right: 16px;
      color: #fff; font-size: 14px; text-align: center; line-height: 1.4;
      background: rgba(0,0,0,0.65); padding: 12px; border-radius: 6px; z-index: 10;
    }
    .controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10;
    }
    button {
      padding: 10px 16px; background: rgba(255,255,255,0.9); border: none;
      border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;
    }
    button:hover { background: #fff; }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="counter" id="counter"></div>
    <div class="caption" id="caption"></div>
    <div class="controls">
      <button id="prevBtn">&#9664;</button>
      <button id="playBtn">&#10074;&#10074; Pause</button>
      <button id="nextBtn">&#9654;</button>
      <button id="fsBtn">&#9974; Fullscreen</button>
    </div>
  </div>

  <script>
    const PHOTOS = __PHOTOS__; // [{ src, caption }]
    const DURATION = __DURATION__;
    const container = document.getElementById("container");
    const counter = document.getElementById("counter");
    const caption = document.getElementById("caption");
    const playBtn = document.getElementById("playBtn");

    const slides = PHOTOS.map((p, n) => {
      const img = document.createElement("img");
      img.className = "slide";
      img.src = p.src;
      img.alt = "Photo " + (n + 1);
      container.insertBefore(img, counter);
      return img;
    });

    let index = 0;
    let timer = null;

    function show(i) {
      index = (i + PHOTOS.length) % PHOTOS.length;
      slides.forEach((s, n) => s.classList.toggle("active", n === index));
      counter.textContent = "Photo " + (index + 1) + " / " + PHOTOS.length;
      caption.textContent = PHOTOS[index].caption;
      caption.style.display = PHOTOS[index].caption ? "" : "none";
    }

    function play() {
      clearInterval(timer);
      timer = setInterval(() => show(index + 1), DURATION);
      playBtn.innerHTML = "&#10074;&#10074; Pause";
    }
    function pause() {
      clearInterval(timer);
      timer = null;
      playBtn.innerHTML = "&#9654; Play";
    }

    playBtn.onclick = () => (timer ? pause() : play());
    document.getElementById("nextBtn").onclick = () => { show(index + 1); if (timer) play(); };
    document.getElementById("prevBtn").onclick = () => { show(index - 1); if (timer) play(); };
    document.getElementById("fsBtn").onclick = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else container.requestFullscreen();
    };

    show(0);
    play();
  </script>
</body>
</html>
